<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>音频文件 - GoodMe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" href="./assets/images/avatar.jpg" type="image/jpeg" />
  <style>
    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --text: #1a1a2e;
      --text-dim: #636e72;
      --text-muted: #b2bec3;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
      --shadow-hover: 0 6px 24px rgba(0,0,0,0.1);
      --radius: 14px;
      --radius-sm: 10px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --primary: #e17055;
      --primary-soft: rgba(225, 112, 85, 0.12);
      --ease: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 3rem;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 400px at 10% 5%, rgba(225, 112, 85, 0.08), transparent),
        radial-gradient(ellipse 500px 500px at 90% 20%, rgba(15, 139, 141, 0.05), transparent),
        radial-gradient(ellipse 400px 500px at 50% 95%, rgba(253, 203, 110, 0.05), transparent);
      pointer-events: none;
      z-index: 0;
    }
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }
    .top-bar-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 0.65rem 1.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .top-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--text);
    }
    .top-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background-image: url(./assets/images/avatar.jpg);
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 0 2px #fff, 0 2px 8px rgba(0,0,0,0.1);
    }
    .top-name { font-weight: 700; font-size: 0.95rem; line-height: 1.2; }
    .top-tag { font-size: 0.72rem; color: var(--text-dim); }
    .back-link {
      font-size: 0.85rem;
      color: var(--text-dim);
      text-decoration: none;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      background: rgba(0,0,0,0.04);
      transition: background var(--ease), color var(--ease);
      white-space: nowrap;
    }
    .back-link:hover { background: rgba(0,0,0,0.08); color: var(--text); }

    .content {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.25rem 1.1rem 0;
      position: relative;
      z-index: 1;
    }

    .page-head { margin-bottom: 1.15rem; }
    .page-head h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }
    .page-head p {
      color: var(--text-dim);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .panel {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.1rem 1.05rem 1.15rem;
      margin-bottom: 1rem;
    }
    .panel-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.85rem;
      flex-wrap: wrap;
    }
    .panel-title {
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .panel-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .panel-desc {
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .group-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 0.03em;
      margin: 0.85rem 0 0.45rem;
      padding-left: 0.15rem;
    }
    .group-label:first-child { margin-top: 0; }

    .audio-stack {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .audio-card {
      background: #f7f8fa;
      border: 1.5px solid transparent;
      border-radius: var(--radius-sm);
      padding: 0.7rem 0.85rem;
      transition: var(--ease);
    }
    .audio-card:hover {
      background: #f3f4f6;
      border-color: rgba(0,0,0,0.04);
    }
    .audio-card.playing {
      border-color: rgba(225, 112, 85, 0.35);
      background: rgba(225, 112, 85, 0.06);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .audio-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .audio-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      flex-shrink: 0;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .audio-card.playing .audio-icon {
      background: var(--primary);
      color: #fff;
      box-shadow: none;
    }

    .audio-info { flex: 1; min-width: 0; }
    .audio-name {
      font-weight: 700;
      font-size: 0.88rem;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .audio-meta {
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 0.1rem;
    }

    .audio-actions {
      display: flex;
      gap: 0.35rem;
      flex-shrink: 0;
    }
    .audio-btn {
      width: 34px;
      height: 34px;
      border: 1.5px solid rgba(0,0,0,0.08);
      border-radius: 9px;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: var(--ease);
      color: var(--text-dim);
      font-family: var(--font);
      flex-shrink: 0;
    }
    .audio-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
    }
    .audio-btn.play-btn.playing {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .audio-btn.download-btn:hover {
      background: #0f8b8d;
      border-color: #0f8b8d;
      color: #fff;
    }

    .audio-progress-wrap {
      display: none;
      align-items: center;
      gap: 0.55rem;
      margin-top: 0.55rem;
      padding-left: 3.35rem;
    }
    .audio-card.playing .audio-progress-wrap { display: flex; }
    .audio-progress { flex: 1; }
    .audio-progress input[type="range"] {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(0,0,0,0.1);
      border-radius: 999px;
      outline: none;
    }
    .audio-progress input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .audio-progress input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .audio-time {
      font-size: 0.68rem;
      color: var(--text-dim);
      min-width: 72px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-muted);
    }
    .empty-state-icon { font-size: 2.2rem; margin-bottom: 0.45rem; }
    .empty-state-text { font-size: 0.85rem; }

    .more-stack {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .more-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.9rem 1rem;
      background: #f7f8fa;
      border: 1.5px solid transparent;
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text);
      transition: var(--ease);
    }
    .more-link:hover {
      background: #fff;
      border-color: rgba(0,0,0,0.06);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }
    .more-link-icon {
      width: 40px; height: 40px;
      border-radius: 11px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .more-link-body { flex: 1; min-width: 0; }
    .more-link-title {
      display: block;
      font-weight: 700;
      font-size: 0.9rem;
      line-height: 1.3;
    }
    .more-link-sub {
      display: block;
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 0.1rem;
    }
    .more-link-arrow {
      font-size: 1.1rem;
      color: var(--text-muted);
      transition: var(--ease);
    }
    .more-link:hover .more-link-arrow {
      color: var(--primary);
      transform: translateX(3px);
    }

    .footer-note {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: 0.35rem;
    }

    @media (max-width: 480px) {
      .content { padding: 1rem 0.9rem 0; }
      .page-head h1 { font-size: 1.3rem; }
      .panel { padding: 1rem 0.9rem; }
      .audio-card { padding: 0.6rem 0.7rem; }
      .audio-row { gap: 0.5rem; }
      .audio-icon { width: 36px; height: 36px; font-size: 0.9rem; }
      .audio-btn { width: 32px; height: 32px; font-size: 0.8rem; }
      .audio-progress-wrap { padding-left: 2.9rem; }
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <div class="top-bar">
    <div class="top-bar-inner">
      <a href="./index.html" class="top-brand">
        <div class="top-avatar"></div>
        <div>
          <div class="top-name">GoodMe</div>
          <div class="top-tag">音频文件</div>
        </div>
      </a>
      <a href="./index.html" class="back-link">← 返回首页</a>
    </div>
  </div>

  <div class="content">
    <div class="page-head">
      <h1>音频文件</h1>
      <p>在线试听击杀音效与趣味音频，也可直接下载到本地。</p>
    </div>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <span class="panel-dot" style="background:var(--primary)"></span>
          音频列表
        </div>
        <div class="panel-desc" id="audioCount">—</div>
      </div>
      <div id="audioList"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <span class="panel-dot" style="background:#fdcb6e"></span>
          更多资源
        </div>
        <div class="panel-desc">外部推荐与合集</div>
      </div>
      <div class="more-stack">
        <a href="https://samplelib.com/zh/sample-wav.html" class="more-link" target="_blank" rel="noopener noreferrer">
          <span class="more-link-icon">🔗</span>
          <span class="more-link-body">
            <span class="more-link-title">更多推荐</span>
            <span class="more-link-sub">SampleLib 免费音效素材</span>
          </span>
          <span class="more-link-arrow">→</span>
        </a>
        <a href="https://wwbeq.lanzoub.com/b019w0t9vi" class="more-link" target="_blank" rel="noopener noreferrer">
          <span class="more-link-icon">📦</span>
          <span class="more-link-body">
            <span class="more-link-title">GM 音频库</span>
            <span class="more-link-sub">密码 888</span>
          </span>
          <span class="more-link-arrow">→</span>
        </a>
      </div>
    </section>

    <p class="footer-note">GoodMe 音频工具</p>
  </div>

  <audio id="player"></audio>

  <script>
    var audioFiles = [
      { name: '击杀音效 1', group: '瓦罗兰特', file: './assets/music/killsounds/kill_1.wav', size: 'wav' },
      { name: '击杀音效 2', group: '瓦罗兰特', file: './assets/music/killsounds/kill_2.wav', size: 'wav' },
      { name: '击杀音效 3', group: '瓦罗兰特', file: './assets/music/killsounds/kill_3.wav', size: 'wav' },
      { name: '击杀音效 4', group: '瓦罗兰特', file: './assets/music/killsounds/kill_4.wav', size: 'wav' },
      { name: '击杀音效 5', group: '瓦罗兰特', file: './assets/music/killsounds/kill_5.wav', size: 'wav' },
      { name: '击杀音效 1', group: '迷你世界', file: './assets/music/mini/kill_1.wav', size: 'wav' },
      { name: '击杀音效 2', group: '迷你世界', file: './assets/music/mini/kill_2.wav', size: 'wav' },
      { name: '击杀音效 3', group: '迷你世界', file: './assets/music/mini/kill_3.wav', size: 'wav' },
      { name: '击杀音效 4', group: '迷你世界', file: './assets/music/mini/kill_4.wav', size: 'wav' },
      { name: '击杀音效 5', group: '迷你世界', file: './assets/music/mini/kill_5.wav', size: 'wav' },
      { name: '击杀音效 6', group: '迷你世界', file: './assets/music/mini/kill_6.wav', size: 'wav' },
      { name: '擦皮鞋', group: '趣味音频', file: './assets/music/擦皮鞋.mp3', size: 'mp3' },
      { name: '零容忍', group: '趣味音频', file: './assets/music/零容忍.mp3', size: 'mp3' },
    ];

    var player = document.getElementById('player');
    var audioList = document.getElementById('audioList');
    var audioCount = document.getElementById('audioCount');
    var currentIdx = -1;

    function formatTime(seconds) {
      if (isNaN(seconds)) return '0:00';
      var m = Math.floor(seconds / 60);
      var s = Math.floor(seconds % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function downloadFile(url, filename) {
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function groupFiles(list) {
      var order = [];
      var map = {};
      list.forEach(function (item, idx) {
        var g = item.group || '其他';
        if (!map[g]) {
          map[g] = [];
          order.push(g);
        }
        map[g].push({ item: item, idx: idx });
      });
      return order.map(function (g) {
        return { group: g, items: map[g] };
      });
    }

    function createCard(item, idx) {
      var card = document.createElement('div');
      card.className = 'audio-card' + (idx === currentIdx ? ' playing' : '');
      card.dataset.idx = idx;

      var row = document.createElement('div');
      row.className = 'audio-row';

      var icon = document.createElement('div');
      icon.className = 'audio-icon';
      icon.textContent = '🎵';

      var info = document.createElement('div');
      info.className = 'audio-info';
      var name = document.createElement('div');
      name.className = 'audio-name';
      name.textContent = item.name;
      var meta = document.createElement('div');
      meta.className = 'audio-meta';
      meta.textContent = item.size.toUpperCase();
      info.appendChild(name);
      info.appendChild(meta);

      var actions = document.createElement('div');
      actions.className = 'audio-actions';

      var playBtn = document.createElement('button');
      playBtn.type = 'button';
      playBtn.className = 'audio-btn play-btn' + (idx === currentIdx && !player.paused ? ' playing' : '');
      playBtn.setAttribute('aria-label', '播放');
      playBtn.textContent = (idx === currentIdx && !player.paused) ? '⏸' : '▶';
      playBtn.addEventListener('click', function () {
        togglePlay(idx);
      });

      var dlBtn = document.createElement('button');
      dlBtn.type = 'button';
      dlBtn.className = 'audio-btn download-btn';
      dlBtn.setAttribute('aria-label', '下载');
      dlBtn.textContent = '⬇';
      dlBtn.addEventListener('click', function () {
        downloadFile(item.file, item.file.split('/').pop());
      });

      actions.appendChild(playBtn);
      actions.appendChild(dlBtn);

      row.appendChild(icon);
      row.appendChild(info);
      row.appendChild(actions);
      card.appendChild(row);

      var progWrap = document.createElement('div');
      progWrap.className = 'audio-progress-wrap';
      var prog = document.createElement('div');
      prog.className = 'audio-progress';
      var range = document.createElement('input');
      range.type = 'range';
      range.min = 0;
      range.max = 100;
      range.value = 0;
      range.dataset.idx = idx;
      range.addEventListener('input', function () {
        if (player.duration) {
          player.currentTime = (range.value / 100) * player.duration;
        }
      });
      prog.appendChild(range);
      var time = document.createElement('div');
      time.className = 'audio-time';
      time.textContent = '0:00 / 0:00';
      progWrap.appendChild(prog);
      progWrap.appendChild(time);
      card.appendChild(progWrap);

      return card;
    }

    function renderList() {
      audioList.innerHTML = '';
      if (audioCount) audioCount.textContent = '共 ' + audioFiles.length + ' 个文件';

      if (audioFiles.length === 0) {
        audioList.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🎵</div><div class="empty-state-text">暂无音频文件</div></div>';
        return;
      }

      var groups = groupFiles(audioFiles);
      groups.forEach(function (g) {
        var label = document.createElement('div');
        label.className = 'group-label';
        label.textContent = g.group + ' · ' + g.items.length;
        audioList.appendChild(label);

        var stack = document.createElement('div');
        stack.className = 'audio-stack';
        g.items.forEach(function (entry) {
          stack.appendChild(createCard(entry.item, entry.idx));
        });
        audioList.appendChild(stack);
      });
    }

    function togglePlay(idx) {
      var file = audioFiles[idx];
      if (currentIdx === idx && !player.paused) {
        player.pause();
      } else if (currentIdx === idx && player.paused) {
        player.play();
      } else {
        currentIdx = idx;
        player.src = file.file;
        player.play();
        updatePlayingUI();
      }
    }

    function updatePlayingUI() {
      var cards = audioList.querySelectorAll('.audio-card');
      cards.forEach(function (c) {
        var i = parseInt(c.dataset.idx, 10);
        var active = i === currentIdx;
        c.classList.toggle('playing', active);
        var btn = c.querySelector('.play-btn');
        if (!btn) return;
        var isPlaying = active && !player.paused;
        btn.textContent = isPlaying ? '⏸' : '▶';
        btn.classList.toggle('playing', isPlaying);
      });
    }

    player.addEventListener('play', updatePlayingUI);
    player.addEventListener('pause', updatePlayingUI);

    player.addEventListener('timeupdate', function () {
      var cards = audioList.querySelectorAll('.audio-card');
      cards.forEach(function (c) {
        var i = parseInt(c.dataset.idx, 10);
        if (i !== currentIdx) return;
        var time = c.querySelector('.audio-time');
        var range = c.querySelector('.audio-progress input');
        if (time) time.textContent = formatTime(player.currentTime) + ' / ' + formatTime(player.duration);
        if (range && player.duration) range.value = (player.currentTime / player.duration) * 100;
      });
    });

    player.addEventListener('ended', function () {
      currentIdx = -1;
      updatePlayingUI();
    });

    renderList();
  </script>
</body>
</html>
