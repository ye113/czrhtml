<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>富文本签名生成器 - GoodMe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" href="./assets/images/avatar.jpg" type="image/jpeg" />
  <style>
    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --text: #1a1a2e;
      --text-dim: #636e72;
      --text-muted: #b2bec3;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
      --shadow-hover: 0 6px 24px rgba(0,0,0,0.1);
      --radius: 14px;
      --radius-sm: 10px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --primary: #e56b8a;
      --primary-soft: rgba(229, 107, 138, 0.12);
      --accent: #0f8b8d;
      --success: #00b894;
      --warning: #fdcb6e;
      --ease: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 3rem;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 400px at 12% 4%, rgba(229, 107, 138, 0.08), transparent),
        radial-gradient(ellipse 500px 500px at 92% 18%, rgba(15, 139, 141, 0.05), transparent),
        radial-gradient(ellipse 400px 500px at 50% 95%, rgba(253, 203, 110, 0.05), transparent);
      pointer-events: none;
      z-index: 0;
    }
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }
    .top-bar-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 0.65rem 1.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .top-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--text);
    }
    .top-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background-image: url(./assets/images/avatar.jpg);
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 0 2px #fff, 0 2px 8px rgba(0,0,0,0.1);
    }
    .top-name { font-weight: 700; font-size: 0.95rem; line-height: 1.2; }
    .top-tag { font-size: 0.72rem; color: var(--text-dim); }
    .back-link {
      font-size: 0.85rem;
      color: var(--text-dim);
      text-decoration: none;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      background: rgba(0,0,0,0.04);
      transition: background var(--ease), color var(--ease);
      white-space: nowrap;
    }
    .back-link:hover { background: rgba(0,0,0,0.08); color: var(--text); }

    .content {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.25rem 1.1rem 0;
      position: relative;
      z-index: 1;
    }

    .page-head {
      margin-bottom: 1.15rem;
    }
    .page-head h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }
    .page-head p {
      color: var(--text-dim);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .panel {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.2rem 1.15rem 1.3rem;
      margin-bottom: 1rem;
    }
    .panel-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.9rem;
      flex-wrap: wrap;
    }
    .panel-title {
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .panel-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .panel-desc {
      font-size: 0.78rem;
      color: var(--text-dim);
      line-height: 1.4;
    }

    .field-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    .field-label span { font-weight: 400; color: var(--text-dim); }

    #textInput {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1.5px solid rgba(0,0,0,0.1);
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 1rem;
      outline: none;
      background: #fafbfc;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    #textInput:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .char-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 0.15rem;
      min-height: 52px;
      align-items: center;
      padding: 0.75rem;
      background: #f7f8fa;
      border-radius: var(--radius-sm);
      user-select: none;
    }
    .char-item {
      position: relative;
      width: 44px; height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform .15s, border-color .15s, box-shadow .15s;
      user-select: none;
    }
    .char-item:hover { transform: scale(1.08); }
    .char-item.selected {
      border-color: #fff;
      box-shadow: 0 0 0 2px var(--primary), 0 4px 12px rgba(229, 107, 138, 0.35);
      z-index: 1;
    }
    .char-empty { color: var(--text-muted); font-size: 0.85rem; padding: 6px 4px; }
    .selection-hint {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 0.55rem;
      min-height: 1.2em;
    }

    .toolbar {
      margin-top: 1rem;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.75rem;
      padding: 0.85rem;
      background: #f7f8fa;
      border-radius: var(--radius-sm);
    }
    .toolbar-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .toolbar-group-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 0.04em;
    }
    .toolbar-row {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }
    .tool-btn {
      width: 36px; height: 36px;
      border: 1.5px solid rgba(0,0,0,0.1);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      transition: all .15s;
      color: var(--text);
      font-family: var(--font);
    }
    .tool-btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }
    .tool-btn.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
    }
    .tool-btn-wide {
      width: auto;
      padding: 0 9px;
      font-size: 12px;
    }

    .color-preview {
      width: 36px; height: 36px;
      border: 1.5px solid rgba(0,0,0,0.1);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color .15s, transform .15s;
      position: relative;
      overflow: hidden;
    }
    .color-preview:hover {
      border-color: var(--primary);
      transform: scale(1.05);
    }
    .color-preview input[type="color"] {
      position: absolute;
      inset: -4px;
      width: calc(100% + 8px);
      height: calc(100% + 8px);
      border: none;
      cursor: pointer;
      opacity: 0;
    }

    .size-input {
      width: 56px;
      height: 36px;
      border: 1.5px solid rgba(0,0,0,0.1);
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font);
      outline: none;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }
    .size-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .palette-section { margin-top: 1rem; }
    .palette-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 0.45rem;
    }
    .palette {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .palette-btn {
      width: 28px; height: 28px;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform .15s, border-color .15s, box-shadow .15s;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
    }
    .palette-btn:hover {
      transform: scale(1.12);
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .palette-btn.active-color { border-color: var(--text); }

    .template-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .template-btn {
      padding: 0.45rem 0.9rem;
      border: 1.5px solid rgba(0,0,0,0.08);
      border-radius: 999px;
      background: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      transition: all .15s;
      color: var(--text);
    }
    .template-btn:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .preview-wrap {
      padding: 1.15rem 1.1rem;
      background:
        linear-gradient(180deg, #fff 0%, #f7f8fa 100%);
      border-radius: var(--radius-sm);
      border: 1px dashed rgba(0,0,0,0.1);
      min-height: 96px;
    }
    .preview-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 0.04em;
      margin-bottom: 0.7rem;
    }
    .preview-box {
      word-break: break-all;
      line-height: 1.85;
      min-height: 44px;
    }

    .output-wrap { margin-top: 0.85rem; position: relative; }
    .output-wrap textarea {
      width: 100%;
      height: 84px;
      padding: 0.8rem 0.9rem;
      border: 1.5px solid rgba(0,0,0,0.1);
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      resize: vertical;
      outline: none;
      background: #fafbfc;
      color: var(--text);
      line-height: 1.55;
      transition: border-color .2s, box-shadow .2s;
    }
    .output-wrap textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
      background: #fff;
    }

    .btn-row {
      display: flex;
      gap: 0.6rem;
      margin-top: 1rem;
    }
    .btn {
      flex: 1;
      padding: 0.8rem 1rem;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      transition: opacity .2s, transform .15s, background .15s, box-shadow .15s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 14px rgba(229, 107, 138, 0.28);
    }
    .btn-primary:hover { opacity: .92; }
    .btn-outline {
      background: rgba(0,0,0,0.04);
      color: var(--text);
    }
    .btn-outline:hover { background: rgba(0,0,0,0.08); }

    .footer-note {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: 0.5rem;
    }

    .toast {
      position: fixed;
      bottom: 2rem; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1a2e;
      color: #fff;
      padding: 0.7rem 1.5rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-family: var(--font);
      opacity: 0;
      transition: opacity .3s, transform .3s;
      pointer-events: none;
      z-index: 9999;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 640px) {
      .toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .page-head h1 { font-size: 1.3rem; }
      .char-item { width: 40px; height: 40px; font-size: 16px; }
      .tool-btn { width: 34px; height: 34px; font-size: 12px; }
      .content { padding: 1rem 0.9rem 0; }
      .panel { padding: 1.05rem 0.95rem 1.15rem; }
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <div class="top-bar">
    <div class="top-bar-inner">
      <a href="./index.html" class="top-brand">
        <div class="top-avatar"></div>
        <div>
          <div class="top-name">GoodMe</div>
          <div class="top-tag">专属个签生成器</div>
        </div>
      </a>
      <a href="./index.html" class="back-link">← 返回首页</a>
    </div>
  </div>

  <div class="content">
    <div class="page-head">
      <h1>个性签名生成</h1>
      <p>逐字调色、套用模板，一键复制富文本代码到游戏个性签名。</p>
    </div>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <span class="panel-dot" style="background:var(--primary)"></span>
          文字输入
        </div>
        <div class="panel-desc">最多 50 字</div>
      </div>
      <input id="textInput" type="text" placeholder="输入个性签名内容..." maxlength="50" value="你好，游戏世界！" />
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <span class="panel-dot" style="background:#fd79a8"></span>
          字符选择 & 样式
        </div>
        <div class="panel-desc">Ctrl / Shift 可多选</div>
      </div>

      <div class="field-label">点击选择字符</div>
      <div class="char-list" id="charList"></div>
      <div class="selection-hint" id="selectionHint"></div>

      <div class="toolbar">
        <div class="toolbar-group">
          <div class="toolbar-group-label">颜色</div>
          <div class="toolbar-row">
            <div class="color-preview" id="colorPreview" style="background:#e56b8a">
              <input type="color" id="colorPicker" value="#e56b8a" />
            </div>
          </div>
        </div>
        <div class="toolbar-group">
          <div class="toolbar-group-label">大小</div>
          <div class="toolbar-row">
            <input type="number" class="size-input" id="sizeInput" value="20" min="10" max="60" />
          </div>
        </div>
        <div class="toolbar-group">
          <div class="toolbar-group-label">样式</div>
          <div class="toolbar-row">
            <button class="tool-btn" id="boldBtn" title="加粗"><b>B</b></button>
            <button class="tool-btn" id="italicBtn" title="斜体"><i>I</i></button>
            <button class="tool-btn" id="underlineBtn" title="下划线"><u>U</u></button>
          </div>
        </div>
        <div class="toolbar-group">
          <div class="toolbar-group-label">特殊</div>
          <div class="toolbar-row">
            <button class="tool-btn tool-btn-wide" id="supBtn" title="上标（仅支持数字和英文）">X²</button>
            <button class="tool-btn tool-btn-wide" id="subBtn" title="下标（仅支持数字和英文）">X₂</button>
          </div>
        </div>
      </div>

      <div class="palette-section">
        <div class="palette-label">快速颜色</div>
        <div class="palette" id="palette"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <span class="panel-dot" style="background:var(--warning)"></span>
          预设模板
        </div>
        <div class="panel-desc">一键套用配色风格</div>
      </div>
      <div class="template-list" id="templateList"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">
          <span class="panel-dot" style="background:var(--success)"></span>
          预览 & 输出
        </div>
        <div class="panel-desc">复制后粘贴到游戏签名框</div>
      </div>
      <div class="preview-wrap">
        <div class="preview-label">预览效果</div>
        <div class="preview-box" id="previewBox"></div>
      </div>
      <div class="output-wrap">
        <textarea id="outputBox" readonly placeholder="生成的代码将显示在这里..."></textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="copyBtn">复制代码</button>
        <button class="btn btn-outline" id="resetBtn">重置全部</button>
      </div>
    </section>

    <p class="footer-note">GoodMe 个性签名工具</p>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const DEFAULT_COLORS = [
      '#FF6B6B', '#FF99CC', '#FFB299', '#FFCC99', '#FFE599',
      '#FECA57', '#CCFF99', '#99FFB2', '#00B894', '#99FFCC',
      '#48DBFB', '#99CCFF', '#54A0FF', '#B299FF', '#CC99FF',
      '#E599FF', '#FF9FF3', '#6C5CE7', '#FD79A8', '#FDCB6E',
    ];

    const TEMPLATES = [
      { name: '彩虹渐变', fn: (text) => {
        const colors = ['#FF6B6B','#FF9F43','#FECA57','#48DBFB','#FF9FF3','#6C5CE7'];
        return text.split('').map((ch, i) => ({
          char: ch, color: colors[i % colors.length], size: 20,
          bold: false, italic: false, underline: false
        }));
      }},
      { name: '梦幻紫粉', fn: (text) => {
        const colors = ['#a29bfe','#fd79a8','#e056a0','#c56cf0','#a29bfe','#fd79a8'];
        return text.split('').map((ch, i) => ({
          char: ch, color: colors[i % colors.length], size: 22,
          bold: true, italic: false, underline: false
        }));
      }},
      { name: '火焰文字', fn: (text) => {
        const colors = ['#FF0000','#FF4500','#FF6347','#FF7F50','#FF8C00','#FFA500'];
        return text.split('').map((ch, i) => ({
          char: ch, color: colors[i % colors.length], size: 24,
          bold: true, italic: true, underline: false
        }));
      }},
      { name: '冰霜蓝', fn: (text) => {
        const colors = ['#00CED1','#48D1CC','#5F9EA0','#87CEEB','#B0E0E6','#ADD8E6'];
        return text.split('').map((ch, i) => ({
          char: ch, color: colors[i % colors.length], size: 20,
          bold: false, italic: false, underline: true
        }));
      }},
      { name: '金色传说', fn: (text) => {
        return text.split('').map((ch) => ({
          char: ch, color: '#FFD700', size: 26,
          bold: true, italic: false, underline: false
        }));
      }},
    ];

    let charData = [];
    let selectedIndices = new Set();

    const textInput = document.getElementById('textInput');
    const charList = document.getElementById('charList');
    const selectionHint = document.getElementById('selectionHint');
    const colorPicker = document.getElementById('colorPicker');
    const colorPreview = document.getElementById('colorPreview');
    const sizeInput = document.getElementById('sizeInput');
    const boldBtn = document.getElementById('boldBtn');
    const italicBtn = document.getElementById('italicBtn');
    const underlineBtn = document.getElementById('underlineBtn');
    const palette = document.getElementById('palette');
    const templateList = document.getElementById('templateList');
    const previewBox = document.getElementById('previewBox');
    const outputBox = document.getElementById('outputBox');
    const copyBtn = document.getElementById('copyBtn');
    const resetBtn = document.getElementById('resetBtn');
    const toast = document.getElementById('toast');

    function initCharData(text) {
      charData = text.split('').map((ch, i) => ({
        char: ch,
        color: DEFAULT_COLORS[i % DEFAULT_COLORS.length],
        size: 20,
        bold: false,
        italic: false,
        underline: false
      }));
    }

    function renderChars() {
      charList.innerHTML = '';
      if (!charData.length) {
        charList.innerHTML = '<div class="char-empty">请输入文字</div>';
        return;
      }
      charData.forEach((d, i) => {
        const div = document.createElement('div');
        div.className = 'char-item' + (selectedIndices.has(i) ? ' selected' : '');
        div.style.background = d.color;
        div.style.color = '#fff';
        div.style.fontSize = Math.min(d.size, 22) + 'px';
        div.style.fontWeight = d.bold ? '800' : '600';
        div.style.fontStyle = d.italic ? 'italic' : 'normal';
        div.style.textDecoration = d.underline ? 'underline' : 'none';
        div.textContent = d.char;
        div.dataset.idx = i;
        div.addEventListener('click', (e) => handleCharClick(i, e));
        charList.appendChild(div);
      });
      updateSelectionHint();
      updateToolbarState();
    }

    function handleCharClick(idx, event) {
      if (event.ctrlKey || event.metaKey) {
        if (selectedIndices.has(idx)) {
          selectedIndices.delete(idx);
        } else {
          selectedIndices.add(idx);
        }
      } else if (event.shiftKey && selectedIndices.size > 0) {
        const last = Math.max(...selectedIndices);
        const start = Math.min(last, idx);
        const end = Math.max(last, idx);
        for (let i = start; i <= end; i++) {
          selectedIndices.add(i);
        }
      } else {
        selectedIndices.clear();
        selectedIndices.add(idx);
      }
      renderChars();
    }

    function updateSelectionHint() {
      if (selectedIndices.size === 0) {
        selectionHint.textContent = '未选中任何字符';
      } else if (selectedIndices.size === 1) {
        const idx = [...selectedIndices][0];
        selectionHint.textContent = `已选中: "${charData[idx].char}"`;
      } else {
        selectionHint.textContent = `已选中 ${selectedIndices.size} 个字符`;
      }
    }

    function updateToolbarState() {
      if (selectedIndices.size === 0) return;
      const firstIdx = [...selectedIndices][0];
      const first = charData[firstIdx];

      let uniformColor = first.color;
      let uniformSize = first.size;
      let uniformBold = first.bold;
      let uniformItalic = first.italic;
      let uniformUnderline = first.underline;

      selectedIndices.forEach(idx => {
        const d = charData[idx];
        if (d.color !== uniformColor) uniformColor = '';
        if (d.size !== uniformSize) uniformSize = 0;
        if (d.bold !== uniformBold) uniformBold = false;
        if (d.italic !== uniformItalic) uniformItalic = false;
        if (d.underline !== uniformUnderline) uniformUnderline = false;
      });

      colorPreview.style.background = uniformColor || '#ccc';
      colorPicker.value = uniformColor || '#e56b8a';
      sizeInput.value = uniformSize || '';
      boldBtn.classList.toggle('active', uniformBold);
      italicBtn.classList.toggle('active', uniformItalic);
      underlineBtn.classList.toggle('active', uniformUnderline);
    }

    function applyStyle(prop, value) {
      if (selectedIndices.size === 0) {
        showToast('请先选中字符');
        return;
      }
      selectedIndices.forEach(idx => {
        charData[idx][prop] = value;
      });
      renderPreview();
      renderOutput();
      renderChars();
    }

    colorPicker.addEventListener('input', () => {
      colorPreview.style.background = colorPicker.value;
      applyStyle('color', colorPicker.value);
    });

    sizeInput.addEventListener('change', () => {
      let val = parseInt(sizeInput.value);
      if (isNaN(val) || val < 10) val = 10;
      if (val > 60) val = 60;
      sizeInput.value = val;
      applyStyle('size', val);
    });

    boldBtn.addEventListener('click', () => applyStyle('bold', !boldBtn.classList.contains('active')));
    italicBtn.addEventListener('click', () => applyStyle('italic', !italicBtn.classList.contains('active')));
    underlineBtn.addEventListener('click', () => applyStyle('underline', !underlineBtn.classList.contains('active')));

    const SUPER_MAP = {
      '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹',
      'a':'ᵃ','b':'ᵇ','c':'ᶜ','d':'ᵈ','e':'ᵉ','f':'ᶠ','g':'ᵍ','h':'ʰ','i':'ⁱ','j':'ʲ',
      'k':'ᵏ','l':'ˡ','m':'ᵐ','n':'ⁿ','o':'ᵒ','p':'ᵖ','q':'q','r':'ʳ','s':'ˢ','t':'ᵗ',
      'u':'ᵘ','v':'ᵛ','w':'ʷ','x':'ˣ','y':'ʸ','z':'ᶻ',
      'A':'ᴬ','B':'ᴮ','C':'ᶜ','D':'ᴰ','E':'ᴱ','F':'ᶠ','G':'ᴳ','H':'ᴴ','I':'ᴵ','J':'ᴶ',
      'K':'ᴷ','L':'ᴸ','M':'ᴹ','N':'ᴺ','O':'ᴼ','P':'ᴾ','Q':'Q','R':'ᴿ','S':'ˢ','T':'ᵀ',
      'U':'ᵁ','V':'ⱽ','W':'ᵂ','X':'ˣ','Y':'ʸ','Z':'ᶻ',
      '+':'⁺','-':'⁻','=':'₌','(':'⁽',')':'⁾','n':'ⁿ','i':'ⁱ',
      '₀':'⁰','₁':'¹','₂':'²','₃':'³','₄':'⁴','₅':'⁵','₆':'⁶','₇':'⁷','₈':'⁸','₉':'⁹',
      'ₐ':'ᵃ','ₑ':'ᵉ','ₕ':'ʰ','ᵢ':'ⁱ','ⱼ':'ʲ','ₖ':'ᵏ','ₗ':'ˡ','ₘ':'ᵐ','ₙ':'ⁿ','ₒ':'ᵒ',
      'ₚ':'ᵖ','ᵣ':'ʳ','ₛ':'ˢ','ₜ':'ᵗ','ᵤ':'ᵘ','ᵥ':'ᵛ','ₓ':'ˣ',
      '₊':'⁺','₋':'⁻','₌':'₌','₍':'⁽','₎':'⁾'
    };
    const SUB_MAP = {
      '0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉',
      'a':'ₐ','e':'ₑ','h':'ₕ','i':'ᵢ','j':'ⱼ','k':'ₖ','l':'ₗ','m':'ₘ','n':'ₙ','o':'ₒ',
      'p':'ₚ','r':'ᵣ','s':'ₛ','t':'ₜ','u':'ᵤ','v':'ᵥ','x':'ₓ',
      '+':'₊','-':'₋','=':'₌','(':'₍',')':'₎',
      '⁰':'₀','¹':'₁','²':'₂','³':'₃','⁴':'₄','⁵':'₅','⁶':'₆','⁷':'₇','⁸':'₈','⁹':'₉',
      'ᵃ':'ₐ','ᵉ':'ₑ','ʰ':'ₕ','ⁱ':'ᵢ','ʲ':'ⱼ','ᵏ':'ₖ','ˡ':'ₗ','ᵐ':'ₘ','ⁿ':'ₙ','ᵒ':'ₒ',
      'ᵖ':'ₚ','ʳ':'ᵣ','ˢ':'ₛ','ᵗ':'ᵗ','ᵘ':'ᵤ','ᵛ':'ᵥ','ˣ':'ₓ',
      '⁺':'₊','⁻':'₋','₌':'₌','⁽':'₍','⁾':'₎'
    };

    function convertChar(ch, map) {
      return map[ch] || ch;
    }

    function applySupSub(type) {
      if (selectedIndices.size === 0) {
        showToast('请先选中字符');
        return;
      }
      const map = type === 'sup' ? SUPER_MAP : SUB_MAP;
      selectedIndices.forEach(idx => {
        charData[idx].char = convertChar(charData[idx].char, map);
      });
      textInput.value = charData.map(d => d.char).join('');
      renderAll();
      showToast(type === 'sup' ? '已转为上标' : '已转为下标');
    }

    document.getElementById('supBtn').addEventListener('click', () => applySupSub('sup'));
    document.getElementById('subBtn').addEventListener('click', () => applySupSub('sub'));

    function renderPalette() {
      palette.innerHTML = '';
      DEFAULT_COLORS.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'palette-btn';
        btn.style.background = c;
        btn.addEventListener('click', () => {
          colorPreview.style.background = c;
          colorPicker.value = c;
          applyStyle('color', c);
        });
        palette.appendChild(btn);
      });
    }

    function renderTemplates() {
      templateList.innerHTML = '';
      TEMPLATES.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'template-btn';
        btn.textContent = t.name;
        btn.addEventListener('click', () => {
          const text = textInput.value;
          if (!text) { showToast('请先输入文字'); return; }
          charData = t.fn(text);
          selectedIndices.clear();
          renderAll();
          showToast(`已应用模板: ${t.name}`);
        });
        templateList.appendChild(btn);
      });
    }

    function renderPreview() {
      previewBox.innerHTML = '';
      if (!charData.length) return;
      charData.forEach(d => {
        const span = document.createElement('span');
        span.style.color = d.color;
        span.style.fontSize = d.size + 'px';
        span.style.fontWeight = d.bold ? '800' : '400';
        span.style.fontStyle = d.italic ? 'italic' : 'normal';
        span.style.textDecoration = d.underline ? 'underline' : 'none';
        span.textContent = d.char;
        previewBox.appendChild(span);
      });
    }

    function renderOutput() {
      if (!charData.length) { outputBox.value = ''; return; }

      let groups = [];
      let currentGroup = { chars: [charData[0]], styles: { ...charData[0] } };

      for (let i = 1; i < charData.length; i++) {
        const prev = charData[i - 1];
        const curr = charData[i];
        if (prev.size === curr.size && prev.bold === curr.bold &&
            prev.italic === curr.italic && prev.underline === curr.underline) {
          currentGroup.chars.push(curr);
        } else {
          groups.push(currentGroup);
          currentGroup = { chars: [curr], styles: { ...curr } };
        }
      }
      groups.push(currentGroup);

      let code = '';
      groups.forEach(group => {
        const s = group.styles;
        let outerOpen = [];
        let outerClose = [];

        if (s.size !== 20) {
          outerOpen.push(`<size=${s.size}>`);
          outerClose.unshift('</size>');
        }
        if (s.bold) { outerOpen.push('<b>'); outerClose.unshift('</b>'); }
        if (s.italic) { outerOpen.push('<i>'); outerClose.unshift('</i>'); }
        if (s.underline) { outerOpen.push('<u>'); outerClose.unshift('</u>'); }

        code += outerOpen.join('');

        let colorGroups = [];
        let currentColorGroup = { color: group.chars[0].color, text: group.chars[0].char };
        for (let j = 1; j < group.chars.length; j++) {
          if (group.chars[j].color === currentColorGroup.color) {
            currentColorGroup.text += group.chars[j].char;
          } else {
            colorGroups.push(currentColorGroup);
            currentColorGroup = { color: group.chars[j].color, text: group.chars[j].char };
          }
        }
        colorGroups.push(currentColorGroup);

        colorGroups.forEach(cg => {
          code += `<color='${cg.color}'>${cg.text}</color>`;
        });

        code += outerClose.join('');
      });

      outputBox.value = code;
    }

    function resetAll() {
      initCharData(textInput.value);
      selectedIndices.clear();
      renderAll();
      showToast('已重置全部样式');
    }

    function renderAll() {
      renderChars();
      renderPreview();
      renderOutput();
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    textInput.addEventListener('input', () => {
      initCharData(textInput.value);
      selectedIndices.clear();
      renderAll();
    });

    copyBtn.addEventListener('click', async () => {
      if (!outputBox.value) { showToast('暂无内容可复制'); return; }
      try {
        await navigator.clipboard.writeText(outputBox.value);
        showToast('已复制到剪贴板');
      } catch {
        outputBox.select();
        document.execCommand('copy');
        showToast('已复制到剪贴板');
      }
    });

    resetBtn.addEventListener('click', resetAll);

    renderPalette();
    renderTemplates();
    initCharData(textInput.value);
    renderAll();
  </script>
</body>
